name: CI

# Build, vet, and test on every push/PR to master. Runs on Linux, where the
# backend actually compiles (internal/core uses Linux-only SysProcAttr.Pdeathsig)
# and where the CGO test suite can execute.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend:
    name: Backend (build, vet, test)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm --prefix web-ui ci
      - run: npm --prefix web-ui run build
