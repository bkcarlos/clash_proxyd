name: Release

# Build and publish self-contained release binaries when a v* tag is pushed.
# The binary bundles the web UI + the mihomo core + Country.mmdb (-tags
# webui,bundle); proxyd extracts mihomo/MMDB to disk on first run.
# Also runnable manually (workflow_dispatch) by supplying a tag name.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/publish (e.g. v1.2.3)'
        required: true

permissions:
  contents: write

env:
  # Country.mmdb source (matches the in-app MMDB download default).
  MMDB_URL: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb

jobs:
  release:
    name: Build & release (linux amd64 + arm64, bundled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install arm64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build web UI
        run: |
          npm --prefix web-ui ci
          npm --prefix web-ui run build

      - name: Embed web UI for go:embed
        run: |
          rm -rf internal/webui/dist
          cp -r web-ui/dist internal/webui/dist

      - name: Fetch Country.mmdb (embedded by -tags bundle)
        run: curl -fsSL -o internal/assets/Country.mmdb "$MMDB_URL"

      - name: Vet
        run: go vet ./...

      - name: Build self-contained binaries (web UI + mihomo + MMDB embedded)
        env:
          CGO_ENABLED: '1'
          GOOS: linux
        run: |
          VER="${{ steps.ver.outputs.version }}"
          LDFLAGS="-s -w -X main.version=${VER}"
          MTAG=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
          echo "Bundling mihomo ${MTAG}"
          build_one() {
            arch="$1"; cc="$2"
            # Embed the matching-arch mihomo core for this build.
            curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${MTAG}/mihomo-linux-${arch}-${MTAG}.gz" \
              | gunzip > internal/assets/mihomo
            GOARCH="$arch" CC="$cc" go build -tags webui,bundle -trimpath \
              -ldflags "$LDFLAGS" -o "dist/${arch}/proxyd" ./cmd/proxyd
            ls -lh "dist/${arch}/proxyd"
          }
          build_one amd64 gcc
          ./dist/amd64/proxyd -version
          build_one arm64 aarch64-linux-gnu-gcc
          file dist/amd64/proxyd dist/arm64/proxyd

      - name: Package
        run: |
          VER="${{ steps.ver.outputs.version }}"
          for arch in amd64 arm64; do
            NAME="proxyd_${VER}_linux_${arch}"
            mkdir -p "$NAME"
            cp "dist/${arch}/proxyd" "$NAME/proxyd"
            cp config.example.yaml "$NAME/config.yaml.example"
            cp README.md LICENSE "$NAME/"
            cp deployments/systemd/proxyd.service "$NAME/"
            tar -czf "${NAME}.tar.gz" "$NAME"
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          done
          ls -lh proxyd_*_linux_*.tar.gz*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            proxyd_*_linux_*.tar.gz
            proxyd_*_linux_*.tar.gz.sha256
