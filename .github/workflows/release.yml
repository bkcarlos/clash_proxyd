name: Release

# Build and publish a release binary when a v* tag is pushed.
# Also runnable manually (workflow_dispatch) by supplying a tag name.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/publish (e.g. v1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & release (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Build web UI
        run: |
          npm --prefix web-ui ci
          npm --prefix web-ui run build

      - name: Embed web UI for go:embed
        run: |
          rm -rf internal/webui/dist
          cp -r web-ui/dist internal/webui/dist

      - name: Vet
        run: go vet ./...

      - name: Build proxyd (CGO, embedded web UI)
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -tags webui -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o dist/proxyd ./cmd/proxyd
          ./dist/proxyd -version

      - name: Package
        id: pkg
        run: |
          VER="${{ steps.ver.outputs.version }}"
          NAME="proxyd_${VER}_linux_amd64"
          mkdir -p "$NAME"
          cp dist/proxyd "$NAME/proxyd"
          cp config.example.yaml "$NAME/config.yaml.example"
          cp README.md LICENSE "$NAME/"
          cp deployments/systemd/proxyd.service "$NAME/"
          tar -czf "${NAME}.tar.gz" "$NAME"
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          ls -la "${NAME}.tar.gz" "${NAME}.tar.gz.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            proxyd_*_linux_amd64.tar.gz
            proxyd_*_linux_amd64.tar.gz.sha256
