name: Release

# Build and publish release binaries when a v* tag is pushed.
# Also runnable manually (workflow_dispatch) by supplying a tag name.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/publish (e.g. v1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & release (linux amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install arm64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build web UI
        run: |
          npm --prefix web-ui ci
          npm --prefix web-ui run build

      - name: Embed web UI for go:embed
        run: |
          rm -rf internal/webui/dist
          cp -r web-ui/dist internal/webui/dist

      - name: Vet
        run: go vet ./...

      - name: Build binaries (CGO, embedded web UI)
        env:
          CGO_ENABLED: '1'
          GOOS: linux
        run: |
          VER="${{ steps.ver.outputs.version }}"
          LDFLAGS="-s -w -X main.version=${VER}"
          GOARCH=amd64 CC=gcc go build -tags webui -trimpath -ldflags "$LDFLAGS" -o dist/amd64/proxyd ./cmd/proxyd
          ./dist/amd64/proxyd -version
          GOARCH=arm64 CC=aarch64-linux-gnu-gcc go build -tags webui -trimpath -ldflags "$LDFLAGS" -o dist/arm64/proxyd ./cmd/proxyd
          file dist/amd64/proxyd dist/arm64/proxyd

      - name: Package
        run: |
          VER="${{ steps.ver.outputs.version }}"
          for arch in amd64 arm64; do
            NAME="proxyd_${VER}_linux_${arch}"
            mkdir -p "$NAME"
            cp "dist/${arch}/proxyd" "$NAME/proxyd"
            cp config.example.yaml "$NAME/config.yaml.example"
            cp README.md LICENSE "$NAME/"
            cp deployments/systemd/proxyd.service "$NAME/"
            tar -czf "${NAME}.tar.gz" "$NAME"
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          done
          ls -la proxyd_*_linux_*.tar.gz*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            proxyd_*_linux_*.tar.gz
            proxyd_*_linux_*.tar.gz.sha256
